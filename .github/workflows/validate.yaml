name: Validate

# NOTE: this repo is currently private. HACS only works reliably with public
# repositories (https://hacs.xyz/docs/publish/start/), so `hacs/action` is
# expected to fail the hacsjson/integration_manifest/brands checks here until
# the repo is made public - topics/description/license/readme checks should
# still pass. Not a regression; nothing to fix until going public.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
